###### Windows

- name: Cria diretório para instaladores - Windows
  ansible.windows.win_file:
    path: 'C:\instaladores'
    state: directory
  when: ansible_os_family == 'Windows'

- name: Baixar zip do openPLC - Windows
  ansible.windows.win_get_url:
    url: http://ansiblefiles.sj.ifsc.edu.br/OpenPLC.Editor_4.2.10.zip
    dest: 'C:\instaladores\OpenPLC.Editor_4.2.10.zip'
    force: false
    # timeout: 300 # 5 minutos
  when: ansible_os_family == 'Windows'
  tags:
    - openplc

- name: Extrai o OpenPLC - Windows
  community.windows.win_unzip:
    src: C:\instaladores\OpenPLC.Editor_4.2.10.zip
    dest: C:\Program Files\
    creates: C:\Program Files\OpenPLC.Editor_4.2.10
  when: ansible_os_family == 'Windows'
  tags:
    - openplc

- name: Criando atalho para o OpenPLC
  community.windows.win_shortcut:
    src: 'C:\Program Files\OpenPLC.Editor_4.2.10\OpenPLC Editor.exe'
    dest: C:\Users\Public\Desktop\OpenPLC.lnk
    icon: 'C:\Program Files\OpenPLC.Editor_4.2.10\OpenPLC Editor.exe,0'
  when: ansible_os_family == 'Windows'
  tags:
    - openplc


- name: Baixar e instalar o Elipse E3 - Windows
  ansible.windows.win_package:
    path: http://ansiblefiles.sj.ifsc.edu.br/ElipseE3.exe
    arguments:
      - /S
    product_id: 'E3DataAccess'
    state: present
  when: ansible_os_family == 'Windows'

- name: Cria pasta para RMMS
  ansible.windows.win_file:
    path: 'C:\Program Files\rmms'
    state: directory
  when: ansible_os_family == 'Windows'

- name: Copiando arquivo RMMS - Simulador modbus Master
  ansible.windows.win_get_url:
    url: "http://ansiblefiles.sj.ifsc.edu.br/rmms.exe"
    dest: 'C:\Program Files\rmms\rmms.exe'
  when: ansible_os_family == 'Windows'

- name: Criando atalho para o RMMS
  community.windows.win_shortcut:
    src: C:\Program Files\rmms\rmms.exe
    dest: C:\Users\Public\Desktop\RMMS.lnk
    icon: C:\Program Files\rmms\rmms.exe,0
  when: ansible_os_family == 'Windows'

- name: Instalar o modsim demo slave - Windows
  ansible.windows.win_package:
    path: http://ansiblefiles.sj.ifsc.edu.br/ElipseModSimDemo-enu.exe
    arguments:
      - /S
    product_id: 'Elipse ModSim'
    state: present
  when: ansible_os_family == 'Windows'

- name: Criando atalho para o modsim slave
  community.windows.win_shortcut:
    src: C:\Program Files\Elipse Software\Elipse Modbus Simulator\ElipseModSim.exe
    dest: C:\Users\Public\Desktop\modsimslave.lnk
    icon: C:\Program Files\Elipse Software\Elipse Modbus Simulator\ElipseModSim.exe,0
  when: ansible_os_family == 'Windows'

- name: Baixar e instalar o SG2Client - Windows
  ansible.windows.win_package:
    path: http://ansiblefiles.sj.ifsc.edu.br/sg2client.exe
    arguments:
      - /VERYSILENT
      - /SUPRESSMSGBOXES
      - /NORESTART
      - /SP-
    product_id: 'SG2 Client_is1'
    state: present
  when: ansible_os_family == 'Windows'

- name: Criando atalho para o sg2client
  community.windows.win_shortcut:
    src: C:\Program Files (x86)\TECO\SG2 Client\SG2 Client.exe
    dest: C:\Users\Public\Desktop\SG2Client.lnk
    icon: C:\Program Files (x86)\TECO\SG2 Client\SG2 Client.exe,0
  when: ansible_os_family == 'Windows'

- name: Baixar o PL2303 Prolific - Windows
  ansible.windows.win_get_url:
    url: "http://ansiblefiles.sj.ifsc.edu.br/pl2303prolific.exe"
    dest: 'C:\instaladores\pl2303prolific.exe'
  when: ansible_os_family == 'Windows'
