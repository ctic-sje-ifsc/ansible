#Windows

- name: Baixar e instalar o openPLC - Windows
  ansible.windows.win_package:
    path: http://ansiblefiles.sj.ifsc.edu.br/OpenPLC.exe
    arguments:
      - /S
    product_id: 'OpenPLC_Editor'
    state: present
  when: ansible_os_family == 'Windows'

- name: Baixar e instalar o Elipse E3 - Windows
  ansible.windows.win_package:
    path: http://ansiblefiles.sj.ifsc.edu.br/ElipseE3.exe
    arguments:
      - /S
    product_id: 'E3DataAccess'
    state: present
  when: ansible_os_family == 'Windows'

- name: Cria pasta para RMMS
  ansible.windows.win_file:
    path: 'C:\Program Files\rmms'
    state: directory
  when: ansible_os_family == 'Windows'

- name: Copiando arquivo RMMS - Simulador modbus Master
  ansible.windows.win_get_url:
    url: "http://ansiblefiles.sj.ifsc.edu.br/rmms.exe"
    dest: 'C:\Program Files\rmms\rmms.exe'
  when: ansible_os_family == 'Windows'

- name: Criando atalho para o RMMS
  community.windows.win_shortcut:
    src: C:\Program Files\rmms\rmms.exe
    dest: C:\Users\Public\Desktop\RMMS.lnk
    icon: C:\Program Files\rmms\rmms.exe,0
  when: ansible_os_family == 'Windows'

- name: Copiando arquivo modsim - Simulador modbus Master
  ansible.windows.win_get_url:
    url: "http://ansiblefiles.sj.ifsc.edu.br/modsim.exe"
    dest: 'C:\Program Files\rmms\modsim.exe'
  when: ansible_os_family == 'Windows'

- name: Instalar o modsim demo - Windows
  ansible.windows.win_package:
    path: http://ansiblefiles.sj.ifsc.edu.br/modsim.exe
    arguments:
      - /S
    product_id: 'Elipse ModSim'
    state: present
  when: ansible_os_family == 'Windows'

- name: Baixar e instalar o SG2Client - Windows
  ansible.windows.win_package:
    path: http://ansiblefiles.sj.ifsc.edu.br/sg2client.exe
    arguments:
      - /VERYSILENT
      - /SUPRESSMSGBOXES
      - /NORESTART
      - /SP-
    product_id: 'SG2 Client_is1'
    state: present
  when: ansible_os_family == 'Windows'

- name: Baixar o PL2303 Prolific - Windows
  ansible.windows.win_get_url:
    url: "http://ansiblefiles.sj.ifsc.edu.br/pl2303prolific.exe"
    dest: 'C:\instaladores\pl2303prolific.exe'
  when: ansible_os_family == 'Windows'

- name: Baixar e instalar o teste - Windows
  ansible.windows.win_package:
    path: http://ansiblefiles.sj.ifsc.edu.br/pl2303prolific.exe
    arguments:
      - /S
      - /qn
    product_id: '{ECC3713C-08A4-40E3-95F1-7D0704F1CE5E}'
    state: present
  when: ansible_os_family == 'Windows'
