- name: Baixando e extraindo o software Digital - Linux Debian
  ansible.builtin.unarchive:
    src: https://github.com/hneemann/Digital/releases/latest/download/Digital.zip
    dest: /opt/
    creates: /opt/Digital
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: ansible_os_family == 'Debian'

# - name: Copiando imagem do arduino - Debian
#   ansible.builtin.copy:
#     src: arduino.png
#     dest: /opt/arduino-2.3.4/arduino.png
#     owner: root
#     group: root
#     mode: "0755"
#   when: ansible_os_family == 'Debian'

- name: Criando o arquivo digital.desktop - Linux Debian
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Type=Application
      Name=Digital
      GenericName=Digital logic designer and circuit simulator
      Comment=Digital is an easy-to-use digital logic designer and circuit simulator designed for educational purposes
      Exec=java -jar /opt/Digital/Digital.jar
      Icon=/opt/Digital/icon.svg
      Terminal=false
      Categories=Development;IDE;Electronics;
      Keywords=logic;circuit;simulator;digital;
    dest: /usr/share/applications/digital.desktop
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == 'Debian'

